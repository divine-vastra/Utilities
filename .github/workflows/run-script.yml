name: Scrape and update sheet

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5,10 * * *"    # 10:37, 15:37 IST (off the busy :00/:30 minutes)
    - cron: "37 7,13 * * *"   # 13:07, 19:07 IST

concurrency:
  group: scrape
  cancel-in-progress: false     # never overlap two runs

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30         # kills a hung run so it can't eat your quota
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium

      - run: python TrackShipments.py
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
